services:
  parla:
    build: .
    image: parla:latest
    container_name: parla
    # "unless-stopped" brings the app back whenever OrbStack starts (e.g. at login).
    restart: unless-stopped
    ports:
      # 0.0.0.0 = reachable from other devices in your LAN/WLAN.
      # Use "127.0.0.1:7860:7860" to allow access only from this Mac.
      - "7860:7860"
    volumes:
      # SQLite database with users, settings, vocabulary and conversations.
      - ./data:/data
    environment:
      # Ollama and the speech service (parla-speech) run natively on the Mac. On the
      # server, .env points both at the Mac's Tailscale address (see compose.server.yaml).
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      PARLA_SPEECH_HOST: ${PARLA_SPEECH_HOST:-http://host.docker.internal:11500}
      PARLA_DATA_DIR: /data
      PARLA_MODEL: ${PARLA_MODEL:-}
      PARLA_USERS: ${PARLA_USERS:-hatschibratschi,bellaMelanto}
      # Optional shared password for the whole app (set both, e.g. in .env).
      PARLA_AUTH_USER: ${PARLA_AUTH_USER:-}
      PARLA_AUTH_PASSWORD: ${PARLA_AUTH_PASSWORD:-}
